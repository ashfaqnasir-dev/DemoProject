trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    echo "Creating staging directory..."
    mkdir -p $(Build.ArtifactStagingDirectory)/website
    cp index.html $(Build.ArtifactStagingDirectory)/website/
    echo "Website files staged successfully!"
  displayName: 'Stage HTML Files'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/website'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish Build Artifact (drop)'
