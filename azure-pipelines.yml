trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: BuildStage
  displayName: 'Stage 1: Build & Package'
  jobs:
  - job: BuildJob
    displayName: 'Compile and Package Files'
    steps:
    - script: |
        echo "Code repository se fetch ho gaya..."
        ls -la
      displayName: 'Verify Source Files'

- stage: TestStage
  displayName: 'Stage 2: Automated Testing'
  dependsOn: BuildStage
  jobs:
  - job: TestJob
    displayName: 'Run Quality Checks'
    steps:
    - script: |
        echo "HTML syntax aur link check ho rahe hain..."
        test -f index.html && echo "SUCCESS: index.html mojood hai!" || exit 1
      displayName: 'Check Required Files'
